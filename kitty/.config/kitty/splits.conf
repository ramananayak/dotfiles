# =============================================================================
# Kitty custom bindings — replaces tmux for local workflows
# =============================================================================
# Conventions:
#   - cmd-*        → tab / OS-window operations (macOS-native)
#   - cmd-d / D    → splits (iTerm-style, instantly familiar)
#   - cmd-h/j/k/l  → pane navigation (vim-style, matches nvim)
#   - cmd-ctrl-*   → pane resize
#   - No ctrl-* bindings → keeps shell (readline) and tmux untouched
#   - No bare alt-* → keeps nvim / fzf / shell meta-bindings clean
# =============================================================================


# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# kitty_mod is used by some default bindings; cmd-* takes priority on macOS.
kitty_mod cmd+shift

# Reload config without restart
map cmd+shift+r load_config_file

# Edit kitty config
map cmd+, edit_config_file

# Open scrollback in less / pager
map cmd+shift+h show_scrollback


# -----------------------------------------------------------------------------
# Clipboard
# -----------------------------------------------------------------------------
copy_on_select yes
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard


# -----------------------------------------------------------------------------
# Tabs (your "projects" — one tab per project)
# -----------------------------------------------------------------------------
# Behavior: tabs inherit cwd of current window
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# Create / close
map cmd+t          new_tab_with_cwd
map cmd+w          close_tab

# Rename current tab (this is what you'll use most for project names)
map cmd+shift+i    set_tab_title

# Move tabs around
map cmd+shift+. move_tab_forward
map cmd+shift+, move_tab_backward

# Jump to tab N
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Cycle tabs (kitty defaults, restated for clarity)
map cmd+shift+]  next_tab
map cmd+shift+[  previous_tab


# -----------------------------------------------------------------------------
# Windows (kitty's "windows" = tmux panes / splits)
# -----------------------------------------------------------------------------
enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid

# Splits (iTerm convention)
map cmd+d        launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current

# Close pane
map cmd+shift+w  close_window

# Rename current pane
map cmd+alt+i    set_window_title

# Vim-style pane navigation (matches your tmux + nvim)
map cmd+h        neighboring_window left
map cmd+j        neighboring_window down
map cmd+k        neighboring_window up
map cmd+l        neighboring_window right

# Resize
map cmd+ctrl+h   resize_window narrower
map cmd+ctrl+l   resize_window wider
map cmd+ctrl+k   resize_window taller
map cmd+ctrl+j   resize_window shorter
map cmd+ctrl+0   resize_window reset

# Zoom / unzoom current pane (tmux prefix-z equivalent)
map cmd+shift+z  toggle_layout stack

# Cycle layouts
map cmd+shift+l  next_layout

# Swap panes
map cmd+shift+x  move_window_to_top


# -----------------------------------------------------------------------------
# OS windows (your "Work" vs "Personal" split)
# -----------------------------------------------------------------------------
map cmd+n        new_os_window_with_cwd
map cmd+`        nth_os_window 1
map cmd+shift+`  nth_os_window 2

# Restore window position/size between launches
remember_window_size  yes


# -----------------------------------------------------------------------------
# URL hints (replaces tmux-fzf-url plugin)
# -----------------------------------------------------------------------------
map cmd+shift+u  kitten hints --type url --program default
map cmd+shift+p  kitten hints --type path --program -
map cmd+shift+y  kitten hints --type hash --program -
map cmd+shift+n  kitten hints --type linenum


# -----------------------------------------------------------------------------
# Misc quality-of-life
# -----------------------------------------------------------------------------
# Don't ask "are you sure?" when closing
confirm_os_window_close 0

# Faster cursor / scrollback
scrollback_lines        50000
scrollback_pager_history_size 10

# Better mouse behavior
mouse_hide_wait         3.0
strip_trailing_spaces   smart

# Bell off
enable_audio_bell       no
visual_bell_duration    0.0

# Window padding
window_padding_width    4 6

# Remote control (lets `kitty @` work for scripting later if you want)
allow_remote_control    yes
listen_on               unix:/tmp/kitty-{kitty_pid}
