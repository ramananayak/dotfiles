set-option -g default-terminal "tmux-256color"

# Mouse support
set-option -g mouse on

# Prefix key configuration
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Move status line to top
set-option -g status-position top

# Move status tab position
# set-option -g status-justify absolute-centre

# Vi mode
set-window-option -g mode-keys vi

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Session and history settings
set-option -g detach-on-destroy off     # don't exit from tmux when closing a session
set-option -g history-limit 50000       # increased history size for better scrollback
set-option -g set-clipboard on          # use system clipboard

# FZF URL plugin settings
set-option -g @fzf-url-bind 'u'
set-option -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set-option -g @fzf-url-history-limit "20"

# macOS-optimized pane navigation (Option + arrow keys)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alternative vim-style navigation with Option key
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Useful keybindings
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind R refresh-client
bind C-l send-keys 'C-l'  # Clear screen

# Better split shortcuts
# bind | split-window -h -c "#{pane_current_path}"  # Vertical split
# bind - split-window -v -c "#{pane_current_path}"  # Horizontal split
bind s split-window -v -c "#{pane_current_path}"  # Vertical split
bind v split-window -h -c "#{pane_current_path}"  # Horizontal split

# Pane resizing with repeat (-r allows key to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enhanced copy mode for macOS with kitty
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Plugins
set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "christoomey/vim-tmux-navigator"
set-option -g @plugin "tmux-plugins/tmux-yank"
set-option -g @plugin "sainnhe/tmux-fzf"
set-option -g @plugin "wfxr/tmux-fzf-url"

# Theme: Catppuccin
set-option -g @plugin "catppuccin/tmux"
set-option -g @catppuccin_flavor "mocha"

# catppuccin theme configuration
set-option -g status-left ""
set-option -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '
set-option -g @catppuccin_window_text " #W"
set-option -g @catppuccin_window_current_text " #W"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run "/opt/homebrew/opt/tpm/share/tpm/tpm"
